[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydantic-ai-trustabl"
version = "0.1.0"
description = "Scan an agent repository for reliability and safety weaknesses from a Pydantic AI agent."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Trustabl" }]
keywords = ["pydantic-ai", "agent", "security", "static-analysis", "reliability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pydantic-ai-slim>=2.0", "pydantic>=2.0"]

[project.urls]
Homepage = "https://github.com/trustabl/pydantic-ai-tool"
Source = "https://github.com/trustabl/pydantic-ai-tool"
Issues = "https://github.com/trustabl/pydantic-ai-tool/issues"

# The scanner this release is pinned to. Separate from the package version
# because the two change for different reasons: a packaging fix must not
# imply a new engine, and an engine bump must not imply new package code.
[tool.trustabl]
engine-version = "0.1.13"

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_ai_trustabl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
